<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Faktúra – rozhovor</title>
<script>try{ var t=localStorage.getItem('simple_theme_v1'); if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme',t); }catch(e){}</script>
<style>
  :root{ color-scheme:light; --wall:#efe7dd; --dot:rgba(0,0,0,.035); --head:#0f766e; --head-ink:#fff; --bot:#fff; --me:#d9fdd3; --ink:#111b21; --muted:#667781;
         --chip:#fff; --chip-line:#0f766e; --chip-ink:#0f766e; --bar:#f0f2f5; --input:#fff; --line:#d1d7db; --surface:#fff; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; --wall:#0b141a; --dot:rgba(255,255,255,.03); --head:#1f2c34; --head-ink:#e9edef; --bot:#202c33; --me:#005c4b; --ink:#e9edef; --muted:#8696a0; --chip:#202c33; --chip-line:#00a884; --chip-ink:#00d1a4; --bar:#1f2c34; --input:#2a3942; --line:#2f3b43; --surface:#111b21; } }
  :root[data-theme="dark"]{ color-scheme:dark; --wall:#0b141a; --dot:rgba(255,255,255,.03); --head:#1f2c34; --head-ink:#e9edef; --bot:#202c33; --me:#005c4b; --ink:#e9edef; --muted:#8696a0; --chip:#202c33; --chip-line:#00a884; --chip-ink:#00d1a4; --bar:#1f2c34; --input:#2a3942; --line:#2f3b43; --surface:#111b21; }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%;}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); display:flex; flex-direction:column; height:100dvh; background:var(--wall);}
  header{display:flex; align-items:center; gap:12px; padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top)); background:var(--head); color:var(--head-ink); flex:0 0 auto;}
  header a,header button{color:var(--head-ink); text-decoration:none; font-size:20px; background:none; border:none; cursor:pointer;}
  .av{width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.18); display:grid; place-items:center; font-size:22px;}
  .who{flex:1;} .who b{display:block; font-size:17px;} .who small{opacity:.8; font-size:13px;}
  #log{flex:1; overflow-y:auto; padding:14px 12px 8px; background-image:radial-gradient(var(--dot) 1.2px, transparent 1.3px); background-size:18px 18px;}
  .wrap{max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:6px;}
  .msg{max-width:84%; padding:9px 12px 8px; border-radius:12px; font-size:17px; line-height:1.4; box-shadow:0 1px .5px rgba(0,0,0,.13); position:relative; animation:pop .2s ease-out;}
  .msg.bot{align-self:flex-start; background:var(--bot); border-top-left-radius:4px;}
  .msg.me{align-self:flex-end; background:var(--me); border-top-right-radius:4px;}
  .msg .t{display:block; text-align:right; font-size:11px; color:var(--muted); margin-top:2px;}
  .msg b{font-weight:700;}
  @keyframes pop{from{transform:translateY(6px); opacity:0;} to{transform:none; opacity:1;}}
  .day{align-self:center; background:var(--bar); color:var(--muted); font-size:12px; padding:5px 10px; border-radius:8px; margin:4px 0 8px;}
  .typing{align-self:flex-start; background:var(--bot); border-radius:12px; padding:12px 14px; display:flex; gap:4px;}
  .typing i{width:7px; height:7px; border-radius:50%; background:var(--muted); animation:blink 1s infinite;}
  .typing i:nth-child(2){animation-delay:.15s;} .typing i:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}
  .sum{margin-top:6px; display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:15px;} .sum span{color:var(--muted);}
  .thumb{margin-top:8px; border-radius:8px; overflow:hidden; background:#fff; border:1px solid var(--line); cursor:zoom-in; width:230px; max-width:100%;}
  #qr{flex:0 0 auto; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:8px 12px 4px; max-width:720px; width:100%; margin:0 auto;}
  #qr:empty{display:none;}
  .chip{font:inherit; font-size:16px; padding:10px 16px; border-radius:99px; border:1.5px solid var(--chip-line); background:var(--chip); color:var(--chip-ink); cursor:pointer; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .chip.main{background:var(--chip-line); color:#fff;}
  footer{flex:0 0 auto; display:flex; gap:8px; align-items:center; padding:8px 10px calc(10px + env(safe-area-inset-bottom)); background:var(--bar);}
  footer .in{flex:1; max-width:660px; margin-left:auto;}
  footer input{width:100%; font:inherit; font-size:17px; padding:12px 16px; border:none; border-radius:24px; background:var(--input); color:var(--ink); outline:none;}
  footer input:disabled{opacity:.6;}
  footer button{width:48px; height:48px; border-radius:50%; border:none; background:var(--chip-line); color:#fff; font-size:20px; cursor:pointer; margin-right:auto; flex:0 0 auto;}
  footer button:disabled{opacity:.4; cursor:default;}
</style>
</head>
<body>
<header>
  <a href="dizajny.html" aria-label="Späť na prehľad dizajnov">←</a>
  <div class="av">🧾</div>
  <div class="who"><b>Faktúry</b><small id="sub">online</small></div>
  <button type="button" id="theme" aria-label="Tmavý režim"></button>
</header>
<div id="log"><div class="wrap" id="wrap"><div class="day">Dnes</div></div></div>
<div id="qr" role="group" aria-label="Rýchle odpovede"></div>
<footer>
  <div class="in"><input id="in" placeholder="Vyber odpoveď vyššie…" disabled autocomplete="off"></div>
  <button type="button" id="send" aria-label="Odoslať" disabled>➤</button>
</footer>

<script src="lib/qrcode.min.js"></script>
<script src="lib/html2canvas.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="jadro.js"></script>
<script>
(function(){
const {qs, esc, money, fmtDate} = J;
let {inv, base} = J.startNew(), sg = J.suggest(base), editing = false;
const wrap=qs('#wrap'), log=qs('#log'), qrEl=qs('#qr'), inp=qs('#in'), send=qs('#send');
J.initTheme(qs('#theme'));
const now=()=> new Date().toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'});
const down=()=> log.scrollTo({top:log.scrollHeight, behavior:'smooth'});
const firm=()=> esc((inv.buyer.party||'').split('\n')[0]||'firmu');

function add(who, html){ const d=document.createElement('div'); d.className='msg '+who; d.innerHTML=html+`<span class="t">${now()}${who==='me'?' ✓✓':''}</span>`; wrap.appendChild(d); down(); return d; }
function bot(html, ms=380){
  return new Promise(res=>{ const t=document.createElement('div'); t.className='typing'; t.innerHTML='<i></i><i></i><i></i>'; wrap.appendChild(t); down(); qs('#sub').textContent='píše…';
    setTimeout(()=>{ t.remove(); qs('#sub').textContent='online'; res(add('bot',html)); }, ms); });
}
// rýchle odpovede + (voliteľne) písanie
function ask(chips, input){
  return new Promise(res=>{
    qrEl.innerHTML=''; inp.value='';
    chips.forEach(c=>{ const b=document.createElement('button'); b.type='button'; b.className='chip'+(c.main?' main':''); b.textContent=c.label; b.onclick=()=>{ done(); add('me',esc(c.label)); res({chip:c}); }; qrEl.appendChild(b); });
    const done=()=>{ qrEl.innerHTML=''; inp.disabled=true; send.disabled=true; inp.placeholder='Vyber odpoveď vyššie…'; inp.onkeydown=null; send.onclick=null; };
    if(input){ inp.disabled=false; send.disabled=false; inp.placeholder=input.placeholder||'Napíš odpoveď…'; inp.inputMode=input.mode||'text';
      const go=()=>{ const v=inp.value.trim(); if(!v) return; done(); add('me',esc(v)); res({text:v}); };
      send.onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter') go(); };
      if(input.focus && !matchMedia('(pointer:coarse)').matches) setTimeout(()=>inp.focus(),50);
    }
    down();
  });
}
const num=(t)=> Number(String(t).replace(/\s/g,'').replace(/€/g,'').replace(',','.'));

/* ---------- rozhovor ---------- */
async function start(){
  if(!base){
    await bot('Ahoj! 👋 Zatiaľ tu nemám žiadnu faktúru. Najprv vyplň svoje údaje a údaje firmy.');
    await editFixed(); return askNumber();
  }
  await bot(`Ahoj! 👋 Ideme spraviť novú faktúru pre <b>${firm()}</b>?`);
  const r=await ask([{label:'Áno, poďme',main:1},{label:'Upraviť údaje firmy'}]);
  if(r.chip.label!=='Áno, poďme') await editFixed();
  askNumber();
}
async function editFixed(){
  await new Promise(res=> J.sheet('Údaje na faktúre', J.fixedForm(inv, ()=>J.recalc(inv,base)), res));
  await bot('Údaje mám uložené. 👍', 250);
}
async function askNumber(){
  inv.number = inv.number && inv.number!==base?.number? inv.number : (sg.number||inv.number);
  await bot(`Číslo faktúry bude <b>${esc(inv.number||'?')}</b>${base? ` (minule ${esc(base.number)})`:''}. Súhlasí?`);
  const r=await ask(inv.number? [{label:'✓ Áno',main:1},{label:'Napíšem iné'}] : [], {placeholder:'Napíš číslo faktúry', focus:!inv.number});
  if(r.text) inv.number=r.text;
  else if(r.chip.label==='Napíšem iné'){ await bot('Dobre, napíš číslo faktúry:',250); inv.number=(await ask([], {placeholder:'Číslo faktúry', focus:1})).text; }
  J.recalc(inv,base);
  return editing? summary() : askMonth();
}
async function askMonth(){
  const opts=[-1,0,1].map(k=>{ const d=new Date(sg.y,sg.m+k,1); return {y:d.getFullYear(), m:d.getMonth()}; });
  await bot(`Za ktorý mesiac? Navrhujem <b>${J.MONTHS[sg.m]} ${sg.y}</b>.`);
  const r=await ask([...opts.map(o=>({label:J.monthLabel(o.y,o.m)+(o.y===sg.y&&o.m===sg.m?' ✓':''), main:o.y===sg.y&&o.m===sg.m, o})), {label:'Iný mesiac'}], {placeholder:'alebo napíš, napr. 3/2026'});
  let o=r.chip&&r.chip.o;
  if(!o){ let t=r.text;
    if(!t){ await bot('Napíš mesiac a rok, napríklad <b>3/2026</b> alebo <b>marec 2026</b>:',250); t=(await ask([], {placeholder:'napr. 3/2026', focus:1})).text; }
    o=parseMonth(t);
    if(!o){ await bot('Tomu som nerozumel 🙈 Skúsme to znova.',250); return askMonth(); } }
  J.setMonth(inv,o.y,o.m);
  await bot(`Super. Obdobie <b>${fmtDate(inv.period_from)} – ${fmtDate(inv.period_to)}</b>, vystavené a dodané <b>${fmtDate(inv.issue)}</b>, splatné <b>${fmtDate(inv.due)}</b>.`, 300);
  return editing? summary() : askSite();
}
function parseMonth(t){
  t=(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  let m=/(\d{1,2})\s*[\/.\- ]\s*(\d{4})/.exec(t); if(m && +m[1]>=1 && +m[1]<=12) return {m:+m[1]-1, y:+m[2]};
  const names=J.MONTHS.map(x=>x.normalize('NFD').replace(/[̀-ͯ]/g,'').slice(0,3));
  const i=names.findIndex(n=>t.includes(n)); if(i<0) return null; const y=/(\d{4})/.exec(t); return {m:i, y:y? +y[1] : sg.y};
}
async function askSite(){
  const recent=[...new Set(J.sorted().map(r=>J.norm(r.site)).filter(Boolean))].filter(s=>s!==J.norm(base?.site)).slice(0,3);
  await bot(base&&base.site? `Na akej stavbe? Minule to bola <b>${esc(base.site)}</b>.` : 'Na akej stavbe?');
  const r=await ask([...(base&&base.site? [{label:'Rovnaká – '+base.site, main:1, s:base.site}]:[]), ...recent.map(s=>({label:s, s}))], {placeholder:'alebo napíš inú stavbu'});
  inv.site = r.text || r.chip.s;
  return editing? summary() : askPrice();
}
async function askPrice(){
  const prev=base? base.items.reduce((s,it)=>s+it.price,0) : 0;
  await bot(prev? `Koľko fakturujeme? Minule to bolo <b>${money(prev)} €</b>.` : 'Koľko fakturujeme (v eurách)?');
  const r=await ask([...(prev? [{label:'Rovnako – '+money(prev)+' €', main:1, v:'same'}]:[]), {label:'🧮 Vypočítať z hodín', v:'calc'}], {placeholder:'Suma v €, napr. 2400', mode:'decimal'});
  if(r.text){ const v=num(r.text); if(!(v>0)){ await bot('To nie je číslo 🙈 Napíš sumu, napríklad 2400.',250); return askPrice(); } inv.items.forEach((it,i)=>{ if(i===0) it.price=v; }); }
  else if(r.chip.v==='calc') await calc();
  else if(base) inv.items.forEach((it,i)=>{ it.price=base.items[i]?.price ?? it.price; });
  J.recalc(inv,base);
  return summary();
}
async function calc(){
  const mo=J.monthOf(inv)||sg, wd=J.workdays(mo.y,mo.m), p=J.calcPrefs();
  await bot(`Koľko dní si robil? V mesiaci ${J.MONTHS[mo.m]} je <b>${wd}</b> pracovných dní.`, 300);
  let r=await ask([wd,wd-1,wd-2].map(d=>({label:String(d), v:d})), {placeholder:'počet dní', mode:'numeric'}); const days=r.text? num(r.text) : r.chip.v;
  await bot('Koľko hodín denne?', 250);
  r=await ask([...new Set([p.hpd,8,9,10])].map(h=>({label:h+' h', v:h})), {placeholder:'hodín denne', mode:'decimal'}); const hpd=r.text? num(r.text) : r.chip.v;
  await bot('A hodinová sadzba?', 250);
  r=await ask(p.rate? [{label:p.rate+' €/h', v:p.rate, main:1}] : [], {placeholder:'€ za hodinu', mode:'decimal', focus:!p.rate}); const rate=r.text? num(r.text) : r.chip.v;
  const t=Math.round(days*hpd*rate*100)/100;
  if(!(t>0)){ await bot('Niečo nesedí 🙈 Skúsme to znova.',250); return calc(); }
  J.saveCalcPrefs(hpd,rate); inv.items[0].price=t;
  await bot(`To je ${days} × ${hpd} h × ${rate} €/h = <b>${money(t)} €</b>.`, 300);
}
async function summary(){
  editing=false; J.recalc(inv,base);
  const mo=J.monthOf(inv);
  const m=await bot(`Hotovo, tu je zhrnutie:<div class="sum">
    <span>Číslo</span><b>${esc(inv.number)}</b>
    <span>Mesiac</span><b>${mo? esc(J.monthLabel(mo.y,mo.m)) : '–'}</b>
    <span>Stavba</span><b>${esc(inv.site)||'–'}</b>
    <span>Suma</span><b>${money(inv.sums.total)} €</b>
    <span>Firma</span><b>${firm()}</b></div><div class="thumb" title="Zväčšiť"></div>`, 450);
  const th=m.querySelector('.thumb'); J.mount(th, inv); th.onclick=preview;
  const r=await ask([{label:'💾 Uložiť a stiahnuť PDF', main:1, v:'save'},{label:'✏️ Niečo zmeniť', v:'edit'},{label:'👁 Náhľad', v:'prev'}]);
  if(r.chip.v==='prev'){ preview(); return summary(); }
  if(r.chip.v==='edit') return change();
  if(!J.save(inv)) return summary();
  await J.pdf(inv);
  await bot(`✅ Uložené! Faktúra <b>${esc(inv.number)}</b> na <b>${money(inv.sums.total)} €</b> je stiahnutá ako PDF.`, 300);
  return after();
}
async function change(){
  await bot('Čo chceš zmeniť?', 250);
  const r=await ask([{label:'Číslo',f:askNumber},{label:'Mesiac',f:askMonth},{label:'Stavbu',f:askSite},{label:'Sumu',f:askPrice},{label:'Údaje firmy',f:async()=>{ await editFixed(); return summary(); }},{label:'Nič, späť',f:summary}]);
  editing = r.chip.label!=='Sumu';           // po sume sa aj tak ide na zhrnutie
  return r.chip.f();
}
async function after(){
  const r=await ask([{label:'⬇️ Stiahnuť PDF znova',v:'pdf'},{label:'🖨️ Vytlačiť',v:'print'},{label:'➕ Ďalšia faktúra',v:'new',main:1}]);
  if(r.chip.v==='pdf'){ await J.pdf(inv); return after(); }
  if(r.chip.v==='print'){ J.print(inv); return after(); }
  ({inv,base}=J.startNew()); sg=J.suggest(base);
  await bot('Paráda, ideme na ďalšiu. 💪', 250); return askNumber();
}
function preview(){ const d=document.createElement('div'); d.style.cssText='background:#fff;border-radius:8px;overflow:hidden'; J.sheet('Náhľad faktúry', d); J.mount(d, J.recalc(inv,base)); }
start();
})();
</script>
</body>
</html>
