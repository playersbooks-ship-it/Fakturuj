<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faktúra – sprievodca</title>
<script>try{ var t=localStorage.getItem('simple_theme_v1'); if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme',t); }catch(e){}</script>
<style>
  :root{ color-scheme:light; --page:#f4f6fb; --surface:#fff; --ink:#151a2d; --muted:#6a7189; --line:#dfe3ee; --input:#fff;
         --brand:#4f46e5; --brand-ink:#fff; --brand-soft:#eef0ff; --ok:#16a34a; --ok-soft:#eafaf0; --warn:#dc5a4f; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; --page:#0d1020; --surface:#161a2e; --ink:#eceffa; --muted:#9aa1bd; --line:#2b3150; --input:#0f1326; --brand:#8b84ff; --brand-ink:#0d1020; --brand-soft:#1f2350; --ok:#4ade80; --ok-soft:#10291b; --warn:#ff8a80; } }
  :root[data-theme="dark"]{ color-scheme:dark; --page:#0d1020; --surface:#161a2e; --ink:#eceffa; --muted:#9aa1bd; --line:#2b3150; --input:#0f1326; --brand:#8b84ff; --brand-ink:#0d1020; --brand-soft:#1f2350; --ok:#4ade80; --ok-soft:#10291b; --warn:#ff8a80; }
  *{box-sizing:border-box}
  html,body{margin:0; min-height:100%;}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--page); color:var(--ink); font-size:18px;}
  .top{position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--page);}
  .top a,.top button{color:var(--ink); text-decoration:none; font-size:22px; background:none; border:none; cursor:pointer; padding:4px 6px;}
  .prog{flex:1; height:10px; border-radius:99px; background:var(--line); overflow:hidden;}
  .prog i{display:block; height:100%; width:0; background:var(--brand); border-radius:99px; transition:width .35s;}
  .stepno{font-size:15px; color:var(--muted); min-width:44px; text-align:right;}
  main{max-width:560px; margin:0 auto; padding:8px 16px 140px;}
  .q{font-size:28px; font-weight:800; line-height:1.2; margin:18px 0 6px; letter-spacing:-.01em;}
  .sub{color:var(--muted); font-size:17px; margin:0 0 20px; line-height:1.45;}
  .big-in{width:100%; font:inherit; font-size:32px; font-weight:700; padding:18px 18px; border:2.5px solid var(--line); border-radius:18px; background:var(--input); color:var(--ink); text-align:center;}
  .big-in:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft);}
  .prev{margin-top:10px; color:var(--muted); font-size:16px; text-align:center;} .prev b{color:var(--ink);}
  .chips{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; justify-content:center;}
  .chip{border:2px solid var(--line); background:var(--surface); color:var(--ink); border-radius:99px; padding:10px 16px; font:inherit; font-size:16px; cursor:pointer;}
  .chip.on,.chip:hover{border-color:var(--brand); background:var(--brand-soft);}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:18px; margin-top:16px;}
  .months{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px;}
  .months button{font:inherit; font-size:18px; padding:16px 6px; border-radius:16px; border:2px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer;}
  .months button.on{background:var(--brand); border-color:var(--brand); color:var(--brand-ink); font-weight:700;}
  .months button.sug:not(.on){border-color:var(--brand); border-style:dashed;}
  .year{display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:14px; font-size:22px; font-weight:700;}
  .year button{font-size:22px; width:46px; height:46px; border-radius:50%; border:2px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer;}
  .dates{display:grid; grid-template-columns:auto 1fr; gap:8px 14px; font-size:17px;} .dates span{color:var(--muted);} .dates b{text-align:right;}
  .row{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 0; border-top:1px solid var(--line);}
  .row:first-child{border-top:none;} .row .l{color:var(--muted); font-size:15px;} .row .v{font-weight:700; font-size:18px;}
  .row button{font:inherit; font-size:15px; color:var(--brand); background:none; border:none; cursor:pointer; padding:6px; white-space:nowrap;}
  .prevbox{border-radius:14px; overflow:hidden; border:1px solid var(--line); background:#fff; cursor:zoom-in; margin-top:16px;}
  .hero{text-align:center; padding-top:30px;}
  .hero .ico{font-size:64px;}
  .last{font-size:16px; color:var(--muted); line-height:1.6;} .last b{color:var(--ink);}
  .btn{display:block; width:100%; font:inherit; font-size:20px; font-weight:700; padding:18px; border-radius:18px; border:2px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; margin-top:12px; text-align:center; text-decoration:none;}
  .btn.primary{background:var(--brand); border-color:var(--brand); color:var(--brand-ink);}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--brand); font-size:17px; padding:12px;}
  .nav{position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; gap:10px; padding:12px 16px calc(14px + env(safe-area-inset-bottom)); background:var(--surface); border-top:1px solid var(--line);}
  .nav .btn{margin:0;} .nav #back{flex:0 0 32%; white-space:nowrap;}
  @media (max-width:380px){ .months{gap:7px;} .months button{font-size:15px; padding:14px 2px;} .q{font-size:24px;} .big-in{font-size:26px;} .nav .btn{font-size:18px; padding:16px 8px;} }
  .nav[hidden]{display:none;}
  details.calc{margin-top:18px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:6px 14px;}
  details.calc summary{cursor:pointer; padding:10px 0; font-weight:600; color:var(--brand);}
  .cg{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;} .cg label{font-size:13px; color:var(--muted); font-weight:600;}
  .cg input{width:100%; font:inherit; font-size:18px; padding:10px; border:1.5px solid var(--line); border-radius:10px; background:var(--input); color:var(--ink); margin-top:4px;}
  .cres{margin:12px 0 10px; font-size:16px;}
  .item-name{font-size:15px; color:var(--muted); text-align:center; margin:14px 0 6px;}
  .done-ico{font-size:80px; text-align:center; margin-top:30px;}
  .list-row{display:flex; gap:10px; align-items:center; padding:12px 0; border-top:1px solid var(--line);}
  .list-row .i{flex:1;} .list-row small{color:var(--muted);}
  .warn{color:var(--warn); font-size:15px; text-align:center; margin-top:8px; min-height:20px;}
</style>
</head>
<body>
<header class="top">
  <a href="dizajny.html" aria-label="Späť na prehľad dizajnov">←</a>
  <div class="prog" aria-hidden="true"><i id="bar"></i></div>
  <span class="stepno" id="stepno"></span>
  <button type="button" id="theme" aria-label="Tmavý režim"></button>
</header>
<main id="screen"></main>
<footer class="nav" id="nav" hidden>
  <button type="button" class="btn" id="back">← Späť</button>
  <button type="button" class="btn primary" id="next">Ďalej →</button>
</footer>

<script src="lib/qrcode.min.js"></script>
<script src="lib/html2canvas.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="jadro.js"></script>
<script>
(function(){
const {qs, esc, money, fmtDate} = J;
let {inv, base} = J.startNew();
const sug = J.suggest(base);
let step = 0, viewYear = sug.y;
const STEPS = ['start','number','month','site','price','check','done'];
const scr = qs('#screen'), nav = qs('#nav');
J.initTheme(qs('#theme'));

function begin(){
  ({inv, base} = J.startNew());
  inv.number = sug.number || inv.number;
  J.setMonth(inv, sug.y, sug.m); viewYear = sug.y;
  J.recalc(inv, base); go(1);
}
function go(n){ step=n; render(); window.scrollTo({top:0}); }

function render(){
  const k = STEPS[step];
  const total = 5, pos = Math.min(Math.max(step,0), total);
  qs('#bar').style.width = (k==='start'? 0 : k==='done'? 100 : (pos/total*100))+'%';
  qs('#stepno').textContent = (k==='start'||k==='done')? '' : step+' / '+total;
  nav.hidden = (k==='start' || k==='done');
  qs('#next').textContent = k==='check'? '💾 Uložiť a PDF' : 'Ďalej →';
  qs('#back').textContent = '← Späť';
  ({start, number, month, site, price, check, done})[k]();
}

/* ---------- 0: úvod ---------- */
function start(){
  const last = J.latest();
  scr.innerHTML = `<div class="hero"><div class="ico">🧾</div>
    <div class="q">Nová faktúra</div>
    <p class="sub">Prevediem ťa krok za krokom. Na každej obrazovke len jedna otázka.</p></div>
    ${last? `<div class="card last">Vychádzam z poslednej faktúry:<br><b>${esc(last.number)}</b> · ${esc((last.buyer?.party||'').split('\n')[0])}<br>${last.period_from? esc(J.monthLabel(+last.period_from.slice(0,4), +last.period_from.slice(5,7)-1))+' · ' : ''}${money(last.sums?.total)} €</div>` : `<div class="card last">Zatiaľ nie je uložená žiadna faktúra – vyplníš ju celú.</div>`}
    <button type="button" class="btn primary" id="go" style="margin-top:22px">▶ Začať novú faktúru</button>
    <button type="button" class="btn" id="hist">📄 Staršie faktúry</button>
    <button type="button" class="btn ghost" id="fixed">⚙️ Stále údaje (firma, IBAN, pečiatka)</button>`;
  qs('#go').onclick = begin;
  qs('#hist').onclick = history;
  qs('#fixed').onclick = ()=> J.sheet('Stále údaje', J.fixedForm(inv, ()=>J.recalc(inv,base)));
}

/* ---------- 1: číslo ---------- */
function number(){
  scr.innerHTML = `<div class="q">Aké bude číslo faktúry?</div><p class="sub">Navrhol som ďalšie číslo v poradí. Ak sedí, stlač <b>Ďalej</b>.</p>
    <input class="big-in" id="num" value="${esc(inv.number)}" inputmode="text" autocomplete="off">
    ${base? `<div class="prev">Minule: <b>${esc(base.number)}</b></div>`:''}
    ${sug.number && inv.number!==sug.number? `<div class="chips"><button type="button" class="chip" id="usesug">Použiť ${esc(sug.number)}</button></div>`:''}
    <div class="warn" id="warn"></div>`;
  qs('#num').oninput = (e)=>{ inv.number=e.target.value; J.recalc(inv,base); check1(); };
  const u=qs('#usesug'); if(u) u.onclick=()=>{ inv.number=sug.number; render(); };
  check1();
}
function check1(){
  const w=qs('#warn'); if(!w) return;
  w.textContent = !J.norm(inv.number)? 'Zadaj číslo faktúry.' : (base && J.norm(inv.number)===J.norm(base.number))? '⚠️ Toto číslo mala aj minulá faktúra.' : '';
}

/* ---------- 2: mesiac ---------- */
function month(){
  const cur = J.monthOf(inv);
  scr.innerHTML = `<div class="q">Za ktorý mesiac?</div><p class="sub">Ťukni na mesiac – dátumy sa nastavia samé.</p>
    <div class="year"><button type="button" id="py" aria-label="Predchádzajúci rok">‹</button><span>${viewYear}</span><button type="button" id="ny" aria-label="Nasledujúci rok">›</button></div>
    <div class="months">${J.MONTHS_CAP.map((m,i)=>`<button type="button" data-m="${i}" class="${cur&&cur.y===viewYear&&cur.m===i?'on':''} ${sug.y===viewYear&&sug.m===i?'sug':''}">${m}</button>`).join('')}</div>
    ${inv.period_from? `<div class="card dates">
      <span>Obdobie</span><b>${fmtDate(inv.period_from)} – ${fmtDate(inv.period_to)}</b>
      <span>Vystavená</span><b>${fmtDate(inv.issue)}</b>
      <span>Dodanie</span><b>${fmtDate(inv.delivery)}</b>
      <span>Splatnosť</span><b>${fmtDate(inv.due)}</b></div>`:''}`;
  qs('#py').onclick=()=>{ viewYear--; month(); };
  qs('#ny').onclick=()=>{ viewYear++; month(); };
  scr.querySelectorAll('[data-m]').forEach(b=> b.onclick=()=>{ J.setMonth(inv, viewYear, +b.dataset.m); month(); });
}

/* ---------- 3: stavba ---------- */
function site(){
  const recent=[...new Set(J.sorted().map(r=>J.norm(r.site)).filter(Boolean))].slice(0,6);
  scr.innerHTML = `<div class="q">Na akej stavbe?</div><p class="sub">Ak je stavba rovnaká ako minule, len stlač <b>Ďalej</b>.</p>
    <input class="big-in" id="site" value="${esc(inv.site)}" style="font-size:24px" autocomplete="off">
    ${recent.length? `<div class="chips">${recent.map(s=>`<button type="button" class="chip ${s===J.norm(inv.site)?'on':''}" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>`:''}`;
  qs('#site').oninput=(e)=>{ inv.site=e.target.value; scr.querySelectorAll('[data-s]').forEach(c=>c.classList.toggle('on', c.dataset.s===J.norm(inv.site))); };
  scr.querySelectorAll('[data-s]').forEach(c=> c.onclick=()=>{ inv.site=c.dataset.s; site(); });
}

/* ---------- 4: cena ---------- */
function price(){
  const p=J.calcPrefs(), mo=J.monthOf(inv)||{y:sug.y,m:sug.m};
  scr.innerHTML = `<div class="q">Koľko fakturuješ?</div><p class="sub">Suma v eurách (bez DPH, nie si platca).</p>
    ${inv.items.map((it,i)=>`
      ${inv.items.length>1||it.name? `<div class="item-name">${esc(it.name||('Položka '+(i+1)))}</div>`:''}
      <input class="big-in pr" data-i="${i}" type="number" step="0.01" inputmode="decimal" value="${it.price||''}" placeholder="0,00">
      ${base&&base.items[i]? `<div class="prev">Minule: <b>${money(base.items[i].price)} €</b></div>`:''}`).join('')}
    <details class="calc"><summary>🧮 Vypočítať z hodín</summary>
      <div class="cg"><label>Pracovné dni<input id="cd" type="number" inputmode="numeric" value="${J.workdays(mo.y,mo.m)}"></label>
        <label>Hodín denne<input id="ch" type="number" step="0.25" inputmode="decimal" value="${esc(p.hpd)}"></label>
        <label>Sadzba €/h<input id="cr" type="number" step="0.01" inputmode="decimal" value="${esc(p.rate)}"></label></div>
      <div class="cres" id="cres"></div>
      <button type="button" class="btn primary" id="capply" style="font-size:17px;padding:12px">✓ Použiť ako cenu</button>
      <p class="sub" style="font-size:14px;margin:10px 0">Pracovné dni = Po–Pi v mesiaci ${esc(J.monthLabel(mo.y,mo.m))}, bez sviatkov.</p>
    </details>`;
  scr.querySelectorAll('.pr').forEach(x=> x.oninput=()=>{ inv.items[+x.dataset.i].price=Number(x.value)||0; J.recalc(inv,base); });
  const v=id=>Number(qs(id).value)||0, upd=()=>{ const t=Math.round(v('#cd')*v('#ch')*v('#cr')*100)/100; qs('#cres').innerHTML=`${v('#cd')} dní × ${v('#ch')} h × ${v('#cr')} €/h = <b>${money(t)} €</b>`; return t; };
  ['#cd','#ch','#cr'].forEach(id=> qs(id).oninput=upd); upd();
  qs('#capply').onclick=()=>{ const t=upd(); if(!t) return; J.saveCalcPrefs(v('#ch'),v('#cr')); inv.items[0].price=t; J.recalc(inv,base); price(); };
}

/* ---------- 5: kontrola ---------- */
function check(){
  J.recalc(inv,base);
  const mo=J.monthOf(inv);
  scr.innerHTML = `<div class="q">Skontroluj faktúru</div><p class="sub">Ak je všetko v poriadku, stlač <b>Uložiť a PDF</b>.</p>
    <div class="card">
      <div class="row"><div><div class="l">Číslo faktúry</div><div class="v">${esc(inv.number)}</div></div><button type="button" data-go="1">Zmeniť</button></div>
      <div class="row"><div><div class="l">Mesiac</div><div class="v">${mo? esc(J.monthLabel(mo.y,mo.m)) : '–'}</div></div><button type="button" data-go="2">Zmeniť</button></div>
      <div class="row"><div><div class="l">Stavba</div><div class="v">${esc(inv.site)||'–'}</div></div><button type="button" data-go="3">Zmeniť</button></div>
      <div class="row"><div><div class="l">Suma</div><div class="v">${money(inv.sums.total)} €</div></div><button type="button" data-go="4">Zmeniť</button></div>
      <div class="row"><div><div class="l">Odberateľ</div><div class="v">${esc((inv.buyer.party||'').split('\n')[0])||'–'}</div></div><button type="button" id="fx">Stále údaje</button></div>
    </div>
    <div class="prevbox" id="pv" title="Zväčšiť faktúru"></div>
    <p class="sub" style="text-align:center;font-size:14px;margin-top:8px">Ťukni na faktúru pre zväčšenie</p>`;
  scr.querySelectorAll('[data-go]').forEach(b=> b.onclick=()=>go(+b.dataset.go));
  qs('#fx').onclick=()=> J.sheet('Stále údaje', J.fixedForm(inv, ()=>J.recalc(inv,base)), check);
  J.mount(qs('#pv'), inv);
  qs('#pv').onclick=()=>{ const d=document.createElement('div'); d.style.cssText='overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff'; d.innerHTML=J.invoiceHTML(inv); J.sheet('Náhľad faktúry', d); };
}
async function saveAndPdf(){
  const st=J.status(inv,base).filter(s=>!s.ok);
  if(st.length && !confirm('Oproti minulej faktúre sa nezmenilo:\n\n• '+st.map(s=>s.label).join('\n• ')+'\n\nNaozaj uložiť takto?')) return;
  if(!J.save(inv)) return;
  go(6); await J.pdf(inv);
}

/* ---------- 6: hotovo ---------- */
function done(){
  scr.innerHTML = `<div class="done-ico">✅</div><div class="q" style="text-align:center">Hotovo!</div>
    <p class="sub" style="text-align:center">Faktúra <b>${esc(inv.number)}</b> na <b>${money(inv.sums.total)} €</b> je uložená a PDF sa stiahlo.</p>
    <button type="button" class="btn primary" id="again">⬇️ Stiahnuť PDF znova</button>
    <button type="button" class="btn" id="pr">🖨️ Vytlačiť</button>
    <button type="button" class="btn ghost" id="home">🏠 Späť na začiatok</button>`;
  qs('#again').onclick=()=>J.pdf(inv); qs('#pr').onclick=()=>J.print(inv); qs('#home').onclick=()=>{ ({inv,base}=J.startNew()); go(0); };
}

/* ---------- staršie faktúry ---------- */
function history(){
  const d=document.createElement('div');
  const list=J.sorted();
  d.innerHTML = list.length? list.map(r=>`<div class="list-row" data-id="${r.id}"><div class="i"><b>${esc(r.number)}</b> · ${esc(fmtDate(r.issue))}<br><small>${esc((r.buyer?.party||'').split('\n')[0])} · ${money(r.sums?.total)} €</small></div><button type="button" class="chip" data-a="pdf">PDF</button></div>`).join('') : '<p class="sub">Zatiaľ žiadne faktúry.</p>';
  d.addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return; const r=list.find(x=>x.id===+b.closest('[data-id]').dataset.id); if(r) J.pdf(J.recalc(J.normalize(r))); });
  J.sheet('Staršie faktúry', d);
}

qs('#back').onclick=()=> go(Math.max(0, step-1));
qs('#next').onclick=()=>{
  const k=STEPS[step];
  if(k==='number' && !J.norm(inv.number)){ qs('#num').focus(); return; }
  if(k==='month' && !inv.period_from) return;
  if(k==='check') return saveAndPdf();
  go(step+1);
};
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.tagName==='INPUT' && !nav.hidden) qs('#next').click(); });
addEventListener('resize',()=>{ const pv=qs('#pv'); if(pv) J.fit(pv); });
render();
})();
</script>
</body>
</html>
